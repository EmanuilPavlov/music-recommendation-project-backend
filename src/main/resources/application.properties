spring.application.name=music-project

spring.datasource.url=jdbc:mysql://localhost:3306/music_database
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

firebase.key.path=src/main/resources/music-recommendation-app-f7fbb-firebase-adminsdk-fbsvc-1e4adf4beb.json

# Ensure controllers are scanned
spring.main.allow-circular-references=true

# Logging
logging.level.com.example.student_system.musicproject=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG